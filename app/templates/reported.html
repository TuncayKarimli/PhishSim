<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanks for reporting</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="center-wrap">
    <div class="card auth-card" style="max-width:460px; text-align:center;">
      <div style="font-size:2.4rem; line-height:1;">✅</div>
      <h1 style="margin:12px 0 6px; color: var(--safe);">Great catch!</h1>
      <p class="meta" style="margin-bottom:0;">
        This was a simulated phishing email, and you did exactly the right thing by
        reporting it instead of clicking. Reporting suspicious messages is the single
        most useful habit for keeping everyone safe. Thank you.
      </p>
    </div>
  </div>
</body>
</html>
