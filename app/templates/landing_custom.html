<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — {{ company }}</title>
  <style>
    /* Authorised phishing-simulation recreation, branded by company name.
       Password is DISCARDED — never read, logged, or stored. */
    *{box-sizing:border-box}
    :root{--brand:#2d6cdf}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1a1f26}
    .bg{min-height:100vh;display:grid;place-items:center;padding:24px;
        background:linear-gradient(135deg,#1a2740 0%,#243b6b 45%,var(--brand) 120%);}
    .card{background:#fff;width:420px;max-width:100%;border-radius:14px;overflow:hidden;
          box-shadow:0 18px 50px rgba(10,20,40,.35)}
    .head{padding:34px 36px 22px;text-align:center;border-bottom:1px solid #eef0f3}
    .badge{width:56px;height:56px;border-radius:14px;margin:0 auto 14px;display:grid;place-items:center;
           background:var(--brand);color:#fff;font-weight:800;font-size:24px;letter-spacing:.5px}
    .head h1{font-size:20px;margin:0 0 4px}
    .head p{margin:0;color:#6b7482;font-size:13px}
    .body{padding:26px 36px 34px}
    label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
    input{width:100%;border:1px solid #d7dbe2;border-radius:8px;padding:11px 13px;font-size:15px;outline:none}
    input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(45,108,223,.15)}
    .field{margin-bottom:16px}
    .btn{width:100%;background:var(--brand);color:#fff;border:none;border-radius:8px;padding:12px;
         font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
    .btn:hover{filter:brightness(.95)}
    .row{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin-top:14px}
    a{color:var(--brand);text-decoration:none}
    a:hover{text-decoration:underline}
    .foot{text-align:center;color:#9aa3b0;font-size:12px;padding:16px}
  </style>
</head>
<body>
  <div class="bg">
    <div>
      <div class="card">
        <div class="head">
          <div class="badge">{{ company[0]|upper }}</div>
          <h1>Sign in to {{ company }}</h1>
          <p>Use your {{ company }} account to continue</p>
        </div>
        <div class="body">
          <form method="post" action="{{ url_for('tracking.submit', token=token) }}">
            <input type="text" name="website_url" style="display:none" tabindex="-1" autocomplete="off">
            <div class="field">
              <label for="username">Username or email</label>
              <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required>
            </div>
            <button class="btn" type="submit">Sign in</button>
            <div class="row">
              <label style="font-weight:400;color:#6b7482"><input type="checkbox" style="width:auto"> Keep me signed in</label>
              <a href="#">Forgot password?</a>
            </div>
          </form>
        </div>
      </div>
      <div class="foot">© {{ company }} · Single sign-on</div>
    </div>
  </div>
</body>
</html>
