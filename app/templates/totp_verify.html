<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two-Factor Verification · PhishSim</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    (function() {
      var saved = localStorage.getItem('phishsim-theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>
</head>
<body>
  <div class="center-wrap">
    <div class="card auth-card">
      <div class="spread" style="margin-bottom:8px;">
        <b>Two-Factor Verification</b>
        <span class="tag status">TOTP 2FA</span>
      </div>
      <p class="meta">Enter the 6-digit code from your authenticator app for <b>{{ user.email }}</b>.</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, msg in messages %}
          <div class="flash {{ category }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label for="totp_code">6-digit authenticator code</label>
          <input type="text" id="totp_code" name="totp_code" pattern="[0-9]{6}" maxlength="6"
                 inputmode="numeric" autocomplete="one-time-code" placeholder="123456" required autofocus
                 style="font-family:var(--mono);font-size:1.3rem;letter-spacing:0.2em;text-align:center;">
        </div>
        <button class="btn" type="submit" style="width:100%">Verify &amp; Sign in</button>
      </form>
      <div style="margin-top:14px;text-align:center;">
        <a href="{{ url_for('auth.login') }}" class="meta">← Back to sign in</a>
      </div>
    </div>
  </div>
</body>
</html>
